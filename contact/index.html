</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="logo" href="../index.html" aria-label="AB-Tech home">
        <img src="../images/brand/logo.jpg" width="222" height="101" alt="AB — Made in Sweden">
      </a>
      <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg></button>
      <nav class="site-nav" id="site-nav">
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="../products/">Products</a></li>
          <li><a href="../about-us/">About Us</a></li>
          <li><a href="../news/">News</a></li>
          <li><a href="../contact/" aria-current="page">Contact</a></li>
          <li><a href="../bladelius/">Family</a></li>
          <li><a href="../reviews/">Reviews</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main class="page">
    <div class="wrap">
      <div class="split reverse">
        <div>
          <img src="../images/pages/contact.jpg" alt="AB-Tech product">
        </div>
        <div>
          <h1>Contact form</h1>
          <p class="lede">You can contact us by filling out this form:</p>

          <!--
            PLACEHOLDER KEY: replace YOUR_WEB3FORMS_ACCESS_KEY with a free access key
            from https://web3forms.com before going live. Set the recipient to
            ab-tech@bladelius.com. Formspree works too: change the form action to
            https://formspree.io/f/YOUR_FORM_ID and remove the access_key field.
            Do not commit a real key to a public repository if you can avoid it;
            many hosts let you inject it at deploy time.
          -->
          <form class="form" data-contact action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY">
            <input type="hidden" name="from_name" value="AB-Tech website">
            <input type="hidden" name="subject" value="Contact form — ab-tech.se">
            <div class="hp" aria-hidden="true">
              <label>Leave this empty <input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off"></label>
            </div>

            <div>
              <label for="name">Name <span class="req">*</span></label>
              <input id="name" name="name" type="text" required autocomplete="name">
            </div>
            <div>
              <label for="email">E-mail <span class="req">*</span></label>
              <input id="email" name="email" type="email" required autocomplete="email">
            </div>
            <div>
              <label for="phone">Phone</label>
              <input id="phone" name="phone" type="tel" autocomplete="tel">
            </div>
            <div>
              <label for="message">Message <span class="req">*</span></label>
              <textarea id="message" name="message" required></textarea>
            </div>
            <button class="btn" type="submit">Submit</button>
            <div class="form-status" role="status" aria-live="polite"></div>
            <p class="form-note">Messages are sent to ab-tech@bladelius.com once an access key has been added.</p>
          </form>
        </div>
      </div>
    </div>
  </main>
  <footer class="site-footer">
    <div class="inner">
      <div>AB-Tech by Alexander Bladelius</div>
      <div class="footer-social">

        <a href="https://www.instagram.com/ab_tech_sweden/" target="_blank" rel="noopener" title="Instagram" aria-label="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4zm10 2H7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm-5 3.2A3.8 3.8 0 1 1 8.2 12 3.8 3.8 0 0 1 12 8.2zm0 1.6A2.2 2.2 0 1 0 14.2 12 2.2 2.2 0 0 0 12 9.8zM17.2 6.6a.9.9 0 1 1-.9.9.9.9 0 0 1 .9-.9z"/></svg></a>
      </div>
    </div>
